
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Logo Inspection</title>
  <style>
    body { font-family: sans-serif; background: #e2e8f0; padding: 20px; margin: 0; }
    h1 { color: #1e293b; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 230px; }
    .card.dark-bg { background: #0f172a; color: white; }
    img { max-width: 100%; max-height: 140px; object-fit: contain; background: rgba(128,128,128,0.1); border-radius: 6px; padding: 5px; }
    h3 { margin: 10px 0 0 0; font-size: 13px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Asset Logos Inspection</h1>
  <div class="grid">
    
    <div class="card">
      <img src="./Black.png" />
      <h3>Black.png</h3>
    </div>
  
    <div class="card">
      <img src="./CareChrome-green.png" />
      <h3>CareChrome-green.png</h3>
    </div>
  
    <div class="card">
      <img src="./carechrome-logo-green.png" />
      <h3>carechrome-logo-green.png</h3>
    </div>
  
    <div class="card">
      <img src="./carechrome-logo.png" />
      <h3>carechrome-logo.png</h3>
    </div>
  
    <div class="card dark-bg">
      <img src="./CareChrome-white.png" />
      <h3>CareChrome-white.png</h3>
    </div>
  
    <div class="card">
      <img src="./carechrome.png" />
      <h3>carechrome.png</h3>
    </div>
  
    <div class="card">
      <img src="./green-text.png" />
      <h3>green-text.png</h3>
    </div>
  
    <div class="card">
      <img src="./green.png" />
      <h3>green.png</h3>
    </div>
  
    <div class="card">
      <img src="./NewPrimuxcareFavicon.png" />
      <h3>NewPrimuxcareFavicon.png</h3>
    </div>
  
    <div class="card">
      <img src="./primux-logo.png" />
      <h3>primux-logo.png</h3>
    </div>
  
    <div class="card">
      <img src="./PrimuxCareFavicon.png" />
      <h3>PrimuxCareFavicon.png</h3>
    </div>
  
    <div class="card dark-bg">
      <img src="./white-text.png" />
      <h3>white-text.png</h3>
    </div>
  
    <div class="card dark-bg">
      <img src="./white.png" />
      <h3>white.png</h3>
    </div>
  
  </div>
</body>
</html>
